<section>
<h2>Day 1: The shell and the commit graph</h2>
<ol>
<li><p>A script tally.sh sits in reports/ beside a folder visits/. The whole reports/ folder is copied to a colleague's laptop. Which first line lets the script find visits/ there, from whatever folder it is started?</p><ul><li><b>A.</b> cd visits</li><li><b>B.</b> cd "$(dirname "$0")/visits"</li><li><b>C.</b> cd /mnt/share/reports/visits</li><li><b>D.</b> cd '$(dirname "$0")/visits'</li></ul></li>
<li><p>On a colleague's Linux machine, cut -d' ' -f4 visits.log | sort | uniq -c prints 12 T2 and, further down, 3 T2. Field 4 is the last field. What is the most likely cause?</p><ul><li><b>A.</b> sort did not group the lines</li><li><b>B.</b> uniq -c counts each run twice</li><li><b>C.</b> cut took the wrong field</li><li><b>D.</b> Some lines end in CR LF, so one T2 carries an invisible CR</li></ul></li>
<li><p>A script without set -o pipefail ends with grep -h ERR "$DIR"/*.log | wc -l. DIR names a folder that does not exist. What exit code does the script return, and what does it print?</p><ul><li><b>A.</b> 0, after printing 0 and an error from grep on stderr</li><li><b>B.</b> 2, the code of the failed grep</li><li><b>C.</b> 1, and it prints nothing at all</li><li><b>D.</b> The script stops before wc runs</li></ul></li>
<li><p>A new repository gets one commit on main. Then: git branch fix, two commits on main, git switch fix, one commit. How many commits does main reach, and how many does the repository hold?</p><ul><li><b>A.</b> main 4, the repository 4</li><li><b>B.</b> main 2, the repository 3</li><li><b>C.</b> main 3, the repository 4</li><li><b>D.</b> main 3, the repository 5</li></ul></li>
<li><p>A repository holds one commit, S, on main. Someone runs: git switch -c draft, commits D1, runs git switch main, and commits M1. How many commits does main reach now?</p><ul><li><b>A.</b> 3: S, D1 and M1</li><li><b>B.</b> 2: S and M1</li><li><b>C.</b> 1: M1 only</li><li><b>D.</b> 4: S twice, D1 and M1</li></ul></li>
<li><p>git commit -am "message" also commits a new file that git does not track yet.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>A ticket log has the agent code in field 3, fields separated by spaces. Which pipeline counts tickets per agent?</p><ul><li><b>A.</b> cut -d' ' -f3 tickets.log | sort | uniq -c</li><li><b>B.</b> cut -d' ' -f3 tickets.log | uniq -c | sort</li><li><b>C.</b> sort tickets.log | uniq -c | cut -d' ' -f3</li><li><b>D.</b> cut -d' ' -f3 tickets.log | wc -l</li></ul></li>
<li><p>Without set -o pipefail, the exit code of a pipeline is the exit code of its last command.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>A script writes its results to standard output and its warnings to standard error. Which command keeps the results in out.txt and the warnings in err.txt?</p><ul><li><b>A.</b> bash tally.sh &gt; out.txt &gt; err.txt</li><li><b>B.</b> bash tally.sh 2&gt; out.txt &gt; err.txt</li><li><b>C.</b> bash tally.sh &gt; out.txt 2&gt; err.txt</li><li><b>D.</b> bash tally.sh | tee out.txt err.txt</li></ul></li>
<li><p>A folder is named site photos, with a space. Which command lists its files?</p><ul><li><b>A.</b> ls site photos</li><li><b>B.</b> ls site\photos</li><li><b>C.</b> ls 'site' photos</li><li><b>D.</b> ls "site photos"</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Working together on one history</h2>
<ol>
<li><p>On main, someone runs git branch notes and then commits once. Which name moved?</p><ul><li><b>A.</b> notes, because it is the newest branch</li><li><b>B.</b> Both main and notes</li><li><b>C.</b> main, because HEAD still points at it</li><li><b>D.</b> Neither: the commit has no branch</li></ul></li>
<li><p>A branch fix has three commits. Nobody committed to main since fix started. On main you run git merge fix. What is in the history now?</p><ul><li><b>A.</b> The same three commits; main now points at the last one</li><li><b>B.</b> Three commits and a new merge commit with two parents</li><li><b>C.</b> One new commit holding the three changes together</li><li><b>D.</b> Six commits: the three, and a copy of each on main</li></ul></li>
<li><p>A request changes how the field team's visit plan is checked. Four comments arrive. Which is the most useful review comment?</p><ul><li><b>A.</b> "LGTM, merging"</li><li><b>B.</b> "I don't like this approach"</li><li><b>C.</b> "While you are here, please rewrite the whole planner"</li><li><b>D.</b> "Line 12: the visit interval is set here and in the README; read it from one place"</li></ul></li>
<li><p>Yesterday you pushed a commit that set the visit interval to 90 days instead of 14. Three teammates have pulled since. How do you undo it?</p><ul><li><b>A.</b> git reset --hard to the commit before it, then push --force</li><li><b>B.</b> git revert the commit, then push</li><li><b>C.</b> git commit --amend, then push</li><li><b>D.</b> git restore the file, then tell the team</li></ul></li>
<li><p>A planner project declares tabulate&gt;=0.9. A colleague installs it a year later from the declaration only and gets different output. What would a committed lock file have given them?</p><ul><li><b>A.</b> The exact versions and hashes the author installed, indirect packages included</li><li><b>B.</b> A second list of the same package names</li><li><b>C.</b> A copy of the packages' code inside the repository</li><li><b>D.</b> The newest versions at the time of installing</li></ul></li>
<li><p>Main has not moved since the branch topic was created; topic now has two commits. On main you run git merge topic. What does the graph show afterwards?</p><ul><li><b>A.</b> A new merge commit with two parents on main</li><li><b>B.</b> Copies of the two topic commits, with new ids, on main</li><li><b>C.</b> Main moves to the last commit of topic; no new commit</li><li><b>D.</b> Topic deleted, its commits now belonging to main</li></ul></li>
<li><p>A teammate pushed two commits to the hub. You run git fetch and nothing else. What has changed in your clone?</p><ul><li><b>A.</b> Your main now includes the two new commits</li><li><b>B.</b> Your working files changed to the hub's version</li><li><b>C.</b> Nothing, because fetch only lists what is new</li><li><b>D.</b> origin/main moved; your own main did not</li></ul></li>
<li><p>A pull request changes how the report counts alert hours. Which review comment helps the author most?</p><ul><li><b>A.</b> Line 40: 150 is also in rules.md; read it from one place</li><li><b>B.</b> Looks fine to me, approved without further comments</li><li><b>C.</b> I would have done this differently, but it is your call</li><li><b>D.</b> Please rewrite the whole module in a cleaner, more modern style</li></ul></li>
<li><p>You commit a fix on main and run git push. The host answers that main is protected. What is the normal next step?</p><ul><li><b>A.</b> Push again with --force to override the check</li><li><b>B.</b> Push it on a branch and open a pull request</li><li><b>C.</b> Ask the host administrator to lift the protection</li><li><b>D.</b> Delete the local commit and wait for a reviewer</li></ul></li>
<li><p>When a pull request no longer merges cleanly, its author usually brings the current main into the branch, resolves the conflict there, and pushes.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>A commit that set a wrong threshold was pushed yesterday and others have pulled it. How do you undo it?</p><ul><li><b>A.</b> git reset --hard to the commit before it, then force-push</li><li><b>B.</b> git commit --amend to change it</li><li><b>C.</b> git revert with that commit's id, then push</li><li><b>D.</b> git restore on the file, without a commit</li></ul></li>
<li><p>A project declares tabulate&gt;=0.9 in pyproject.toml. What does its lock file add?</p><ul><li><b>A.</b> Nothing more, since the declaration already names the package</li><li><b>B.</b> A copy of each package's source code</li><li><b>C.</b> The versions of the direct packages only</li><li><b>D.</b> Exact versions and hashes of all packages, indirect ones too</li></ul></li>
<li><p>uv sync --locked stops with an error that the lockfile needs to be updated. What does that mean, and what do you do?</p><ul><li><b>A.</b> The declaration changed after the lock: run uv lock, commit both</li><li><b>B.</b> The package index is unreachable from this network: retry it later</li><li><b>C.</b> The lock is corrupt: delete it and run without it</li><li><b>D.</b> A package was removed from the index: pin an older one</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Rebuild anywhere, leak nothing</h2>
<ol>
<li><p>A teammate pushed to the hub. You want to see their commits before anything in your clone changes. Which command?</p><ul><li><b>A.</b> git pull</li><li><b>B.</b> git merge origin/main</li><li><b>C.</b> git push</li><li><b>D.</b> git fetch</li></ul></li>
<li><p>A planner project reads its visit logs from a folder. A peer will rebuild it on a clean workspace. Where should the folder's location come from?</p><ul><li><b>A.</b> A default path in the code, the author's own folder</li><li><b>B.</b> An argument or a variable, with the README saying where to get the data</li><li><b>C.</b> The repository itself, in a data/ folder</li><li><b>D.</b> A chat message to the peer before the rebuild</li></ul></li>
<li><p>You run the planner image with -v "$PWD/output:/out" and --rm. The container is gone afterwards, yet output/plan.csv is on your disk. Why?</p><ul><li><b>A.</b> --rm copies the container's files out before deleting it</li><li><b>B.</b> The file was written into the image</li><li><b>C.</b> /out inside the container is your own output/ folder, mounted</li><li><b>D.</b> The engine syncs every container folder back to the host</li></ul></li>
<li><p>You run a planner image with --env-file .env; the key is no longer in the code or the image. Who can still read the key?</p><ul><li><b>A.</b> Any program running in that container, and anyone who can inspect it</li><li><b>B.</b> Nobody: variables passed at run time are encrypted</li><li><b>C.</b> Anyone who pulls the image from the registry</li><li><b>D.</b> Nobody, because /data is mounted read-only</li></ul></li>
<li><p>A scan of the planner's history finds a booking-service key in a commit from three weeks ago. The repository has been public since. What is the first action?</p><ul><li><b>A.</b> Rewrite the history with git filter-repo</li><li><b>B.</b> Delete the file in a new commit</li><li><b>C.</b> Make the repository private</li><li><b>D.</b> Revoke the key at the booking service and issue a new one</li></ul></li>
<li><p>A container on a Linux host uses the host's kernel; it is an isolated process, not a separate machine.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>A report image reads its input from /data and writes to /out. Which run keeps the input safe from the program?</p><ul><li><b>A.</b> run -v ./data:/data -v ./output:/out report</li><li><b>B.</b> run -v ./data:/data:ro -v ./output:/out report</li><li><b>C.</b> run -v ./data:/out:ro -v ./output:/data report</li><li><b>D.</b> run report, with the data copied into the image</li></ul></li>
<li><p>A scan finds a live API key in a commit from last month. What do you do first?</p><ul><li><b>A.</b> Rewrite the history so that no commit holds the key any more</li><li><b>B.</b> Delete the file in a new commit</li><li><b>C.</b> Revoke or rotate the key at the service that issued it</li><li><b>D.</b> Make the repository private</li></ul></li>
<li><p>Removing the settings file that held a key, in a new commit, removes the key from the repository.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>A project needs a key. Which set-up keeps it out of the repository and still tells a newcomer what to provide?</p><ul><li><b>A.</b> The key in settings.toml, and settings.toml added to .gitignore afterwards</li><li><b>B.</b> The key base64-encoded in the code</li><li><b>C.</b> The key in the README, in a section marked private</li><li><b>D.</b> An ignored .env file, and a committed .env.example naming the variable</li></ul></li>
<li><p>A history was rewritten to remove a key and force-pushed. What must everyone who cloned it before do?</p><ul><li><b>A.</b> Clone again, or reset hard to the rewritten branch</li><li><b>B.</b> Nothing, because the next git pull fixes their copy</li><li><b>C.</b> Run the secret scanner once</li><li><b>D.</b> Commit their work and push it to the hub as usual</li></ul></li>
<li><p>Which Reproduce section lets a peer rebuild a report project on a clean machine?</p><ul><li><b>A.</b> Run the notebook top to bottom</li><li><b>B.</b> Tools needed, where to get the data, one rebuild command and the expected checksum</li><li><b>C.</b> See the code for details</li><li><b>D.</b> Contact the analyst for the data path</li></ul></li>
<li><p>In a peer reproduction, the rebuild fails: no such folder data/. The repository rightly does not hold the data. What is the fix?</p><ul><li><b>A.</b> Commit the data folder into the repository so that every clone has it</li><li><b>B.</b> Tell the peer the folder in a chat message</li><li><b>C.</b> State where the data comes from and read its folder from a variable</li><li><b>D.</b> Hard-code the peer's folder in the script</li></ul></li>
<li><p>If a fresh clone rebuilds correctly on the author's own laptop, a peer reproduction adds nothing.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>How does a peer know a rebuild reproduced the expected result rather than just running?</p><ul><li><b>A.</b> The program prints no error</li><li><b>B.</b> The output file exists in the output folder after the rebuild has run</li><li><b>C.</b> The numbers look plausible</li><li><b>D.</b> The rebuild compares the output with a committed checksum</li></ul></li>
</ol>
</section>

n.","misconceptions":["","The declaration already names the package; naming it again changes nothing","A lock pins versions; it does not copy source code into the repository","Locks pin what was resolved; they do not move to the newest release"],"lo":["LO4"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-lock","title":"What does the lock add?"},"level":null,"pool":"checkpoint"},{"id":"review-day2-q1","type":"single","prompt":"A teammate pushed to the hub. You want to see their commits before anything in your clone changes. Which command?","options":[{"key":"A","text":"git pull"},{"key":"B","text":"git merge origin/main"},{"key":"C","text":"git push"},{"key":"D","text":"git fetch"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"fetch downloads the commits and moves origin/main only; your main and your files stay until you merge.","misconceptions":["pull is fetch followed by merge: it moves your main and changes your files","merge needs the commits in your clone first; on its own it cannot see the hub","push sends your commits the other way and changes nothing you can read",""],"lo":["LO1"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day2","title":"Which command leaves your own main where it was?"},"level":null,"pool":"checkpoint"},{"id":"check-data-path-q1","type":"single","prompt":"A planner project reads its visit logs from a folder. A peer will rebuild it on a clean workspace. Where should the folder's location come from?","options":[{"key":"A","text":"A default path in the code, the author's own folder"},{"key":"B","text":"An argument or a variable, with the README saying where to get the data"},{"key":"C","text":"The repository itself, in a data/ folder"},{"key":"D","text":"A chat message to the peer before the rebuild"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The code takes the location from outside, and the README records where the data comes from for every reader.","misconceptions":["A default that exists on one disk works for its author only and fails silently elsewhere","","Data in the repository is copied to every clone and mixes results with code","A message reaches one person once; the next reader is stuck again"],"lo":["LO6"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-data-path","title":"Where does the data path belong?"},"level":null,"pool":"checkpoint"},{"id":"check-mount-q1","type":"single","prompt":"You run the planner image with -v \"$PWD/output:/out\" and --rm. The container is gone afterwards, yet output/plan.csv is on your disk. Why?","options":[{"key":"A","text":"--rm copies the container's files out before deleting it"},{"key":"B","text":"The file was written into the image"},{"key":"C","text":"/out inside the container is your own output/ folder, mounted"},{"key":"D","text":"The engine syncs every container folder back to the host"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A bind mount puts a host folder at a path inside the container, so writes there land on the host and outlive the container.","misconceptions":["--rm deletes the container's own writable layer; it copies nothing out","An image is read-only and built before the run; a run never writes into it","","Engines do not sync files back by themselves; only mounts share a folder"],"lo":["LO4"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-mount","title":"Why does the report appear on your disk?"},"level":null,"pool":"checkpoint"},{"id":"check-env-file-q1","type":"single","prompt":"You run a planner image with --env-file .env; the key is no longer in the code or the image. Who can still read the key?","options":[{"key":"A","text":"Any program running in that container, and anyone who can inspect it"},{"key":"B","text":"Nobody: variables passed at run time are encrypted"},{"key":"C","text":"Anyone who pulls the image from the registry"},{"key":"D","text":"Nobody, because /data is mounted read-only"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The variable is part of the running container's environment: its processes read it, and so can anyone allowed to inspect that container.","misconceptions":["","Variables are set for the container's processes; they are not hidden from them","The image was built without the key; passing it at run time adds nothing to the image","A read-only data mount limits the data folder, not the variables"],"lo":["LO5"],"day":3,"session":3,"slide":{"deck":"day3","id":"check-env-file","title":"What does --env-file still expose?"},"level":null,"pool":"checkpoint"},{"id":"check-leak-q1","type":"single","prompt":"A scan of the planner's history finds a booking-service key in a commit from three weeks ago. The repository has been public since. What is the first action?","options":[{"key":"A","text":"Rewrite the history with git filter-repo"},{"key":"B","text":"Delete the file in a new commit"},{"key":"C","text":"Make the repository private"},{"key":"D","text":"Revoke the key at the booking service and issue a new one"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Only revoking makes every copy of the old key useless; cleaning and reporting follow.","misconceptions":["Cleaning removes it from the hub, not from the clones and caches made in three weeks","Removing the file in a new commit leaves every old commit holding the key","Hiding the repository stops new readers, not those who already copied it",""],"lo":["LO5"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-leak","title":"What do you do first?"},"level":null,"pool":"checkpoint"},{"id":"d1-branch-count","type":"single","prompt":"A repository holds one commit, S, on main. Someone runs: git switch -c draft, commits D1, runs git switch main, and commits M1. How many commits does main reach now?","options":[{"key":"A","text":"3: S, D1 and M1"},{"key":"B","text":"2: S and M1"},{"key":"C","text":"1: M1 only"},{"key":"D","text":"4: S twice, D1 and M1"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Main reaches its own commit M1 and the parent chain back to S; D1 is reachable from draft only.","misconceptions":["Counts every commit made in the repository as part of main","","Thinks a commit replaces its parent instead of pointing to it","Believes a branch copies the commits it starts from"],"lo":["LO1"],"day":1,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"d2-fast-forward","type":"single","prompt":"Main has not moved since the branch topic was created; topic now has two commits. On main you run git merge topic. What does the graph show afterwards?","options":[{"key":"A","text":"A new merge commit with two parents on main"},{"key":"B","text":"Copies of the two topic commits, with new ids, on main"},{"key":"C","text":"Main moves to the last commit of topic; no new commit"},{"key":"D","text":"Topic deleted, its commits now belonging to main"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"When main is an ancestor of topic, Git only moves the main pointer forward: a fast-forward.","misconceptions":["Expects a merge commit even when one side has not moved","Confuses a merge with a rebase that rewrites commits","","Thinks commits belong to a branch rather than branches pointing at commits"],"lo":["LO1"],"day":2,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"d1-commit-am","type":"tf","prompt":"git commit -am \"message\" also commits a new file that git does not track yet.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The -a flag stages changes to files git already tracks; a new file needs git add first.","misconceptions":["Thinks -a means every file in the folder",""],"lo":["LO1"],"day":1,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"d2-fetch-moves","type":"single","prompt":"A teammate pushed two commits to the hub. You run git fetch and nothing else. What has changed in your clone?","options":[{"key":"A","text":"Your main now includes the two new commits"},{"key":"B","text":"Your working files changed to the hub's version"},{"key":"C","text":"Nothing, because fetch only lists what is new"},{"key":"D","text":"origin/main moved; your own main did not"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Fetch downloads the commits and moves the remote-tracking names; merging them into main is a separate step.","misconceptions":["Takes fetch for pull: fetch never moves your own branches","Thinks fetching rewrites the working folder","Believes fetch is read-only reporting; it downloads commits and moves origin/ names",""],"lo":["LO1"],"day":2,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"d1-sort-uniq","type":"single","prompt":"A ticket log has the agent code in field 3, fields separated by spaces. Which pipeline counts tickets per agent?","options":[{"key":"A","text":"cut -d' ' -f3 tickets.log | sort | uniq -c"},{"key":"B","text":"cut -d' ' -f3 tickets.log | uniq -c | sort"},{"key":"C","text":"sort tickets.log | uniq -c | cut -d' ' -f3"},{"key":"D","text":"cut -d' ' -f3 tickets.log | wc -l"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Keep the field, sort so equal codes sit together, then count each run.","misconceptions":["","Forgets that uniq only merges neighbouring equal lines","Counts whole lines before keeping the field, so every line is unique","Counts all lines at once instead of per agent"],"lo":["LO2"],"day":1,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"d1-pipefail","type":"tf","prompt":"Without set -o pipefail, the exit code of a pipeline is the exit code of its last command.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Bash reports the last command's status unless pipefail asks for the last non-zero one.","misconceptions":["","Believes any failing stage makes the whole pipeline fail by default"],"lo":["LO2"],"day":1,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"d1-redirect","type":"single","prompt":"A script writes its results to standard output and its warnings to standard error. Which command keeps the results in out.txt and the warnings in err.txt?","options":[{"key":"A","text":"bash tally.sh > out.txt > err.txt"},{"key":"B","text":"bash tally.sh 2> out.txt > err.txt"},{"key":"C","text":"bash tally.sh > out.txt 2> err.txt"},{"key":"D","text":"bash tally.sh | tee out.txt err.txt"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"> redirects standard output (1) and 2> standard error; each goes to its own file.","misconceptions":["Thinks a second > sends the second stream; both redirect standard output","Swaps the stream numbers: 2 is standard error","","Expects a pipe to carry standard error too"],"lo":["LO2"],"day":1,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"d1-quote-space","type":"single","prompt":"A folder is named site photos, with a space. Which command lists its files?","options":[{"key":"A","text":"ls site photos"},{"key":"B","text":"ls site\\photos"},{"key":"C","text":"ls 'site' photos"},{"key":"D","text":"ls \"site photos\""}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Quotes keep the name one word, so ls receives a single argument.","misconceptions":["Forgets that the shell splits unquoted words on spaces","Puts the backslash before the wrong character: it must escape the space","Quotes one word only, so the shell still sees two arguments",""],"lo":["LO2"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"d2-review-comment","type":"single","prompt":"A pull request changes how the report counts alert hours. Which review comment helps the author most?","options":[{"key":"A","text":"Line 40: 150 is also in rules.md; read it from one place"},{"key":"B","text":"Looks fine to me, approved without further comments"},{"key":"C","text":"I would have done this differently, but it is your call"},{"key":"D","text":"Please rewrite the whole module in a cleaner, more modern style"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A useful comment names the line, the problem and a way forward, and stays inside the request.","misconceptions":["","Approves without reading, so the reviewer adds nothing","Gives an opinion with no line, no reason and no suggestion","Asks for a change far beyond the request, with no concrete point"],"lo":["LO3"],"day":2,"session":2,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d2-protected-refusal","type":"single","prompt":"You commit a fix on main and run git push. The host answers that main is protected. What is the normal next step?","options":[{"key":"A","text":"Push again with --force to override the check"},{"key":"B","text":"Push it on a branch and open a pull request"},{"key":"C","text":"Ask the host administrator to lift the protection"},{"key":"D","text":"Delete the local commit and wait for a reviewer"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Protection means main changes only through a reviewed request; the commit itself is fine on a branch.","misconceptions":["Thinks force overrides the host's branch protection","","Treats the protection as an obstacle rather than the team's review rule","Believes the change itself is refused, when only the route is"],"lo":["LO3"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"d2-update-branch","type":"tf","prompt":"When a pull request no longer merges cleanly, its author usually brings the current main into the branch, resolves the conflict there, and pushes.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The author knows the change best; resolving on the branch keeps main clean and lets the reviewer see the resolution.","misconceptions":["","Thinks the reviewer or the host resolves conflicts at merge time"],"lo":["LO3"],"day":2,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"d2-undo-pushed","type":"single","prompt":"A commit that set a wrong threshold was pushed yesterday and others have pulled it. How do you undo it?","options":[{"key":"A","text":"git reset --hard to the commit before it, then force-push"},{"key":"B","text":"git commit --amend to change it"},{"key":"C","text":"git revert with that commit's id, then push"},{"key":"D","text":"git restore on the file, without a commit"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Revert records a new commit that reverses the old one, so nobody's history is rewritten.","misconceptions":["Rewrites history others already have, so their clones disagree","Amend only changes the last local commit, and still rewrites it","","Changes the working file only; history and the hub stay wrong"],"lo":["LO3"],"day":2,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"d2-lock-adds","type":"single","prompt":"A project declares tabulate>=0.9 in pyproject.toml. What does its lock file add?","options":[{"key":"A","text":"Nothing more, since the declaration already names the package"},{"key":"B","text":"A copy of each package's source code"},{"key":"C","text":"The versions of the direct packages only"},{"key":"D","text":"Exact versions and hashes of all packages, indirect ones too"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The declaration says what is acceptable; the lock records exactly what was resolved, down to indirect dependencies and hashes.","misconceptions":["Takes a lower bound for a fixed version","Confuses the lock with a vendored copy of the packages","Forgets the packages those packages need",""],"lo":["LO4"],"day":2,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"d2-locked-fails","type":"single","prompt":"uv sync --locked stops with an error that the lockfile needs to be updated. What does that mean, and what do you do?","options":[{"key":"A","text":"The declaration changed after the lock: run uv lock, commit both"},{"key":"B","text":"The package index is unreachable from this network: retry it later"},{"key":"C","text":"The lock is corrupt: delete it and run without it"},{"key":"D","text":"A package was removed from the index: pin an older one"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"--locked refuses to change the lock; the fix is to update it on purpose and commit it with the declaration.","misconceptions":["","Reads a mismatch between two files as a connection problem","Throws away the record that makes the rebuild repeatable","Guesses at a cause the message does not state"],"lo":["LO4"],"day":2,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"d3-kernel","type":"tf","prompt":"A container on a Linux host uses the host's kernel; it is an isolated process, not a separate machine.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Containers share the host kernel, which is why a kernel flaw or a mounted folder reaches across.","misconceptions":["","Believes a container is a small virtual machine with its own kernel"],"lo":["LO4"],"day":3,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"d3-mounts","type":"single","prompt":"A report image reads its input from /data and writes to /out. Which run keeps the input safe from the program?","options":[{"key":"A","text":"run -v ./data:/data -v ./output:/out report"},{"key":"B","text":"run -v ./data:/data:ro -v ./output:/out report"},{"key":"C","text":"run -v ./data:/out:ro -v ./output:/data report"},{"key":"D","text":"run report, with the data copied into the image"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A read-only bind mount gives the program the data without letting it change it; the output folder is writable.","misconceptions":["Leaves the input writable, so a bug can change the raw data","","Swaps the folders: the program would write into the input","Bakes data into the image, so each month needs a new image"],"lo":["LO4"],"day":3,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"d3-first-action","type":"single","prompt":"A scan finds a live API key in a commit from last month. What do you do first?","options":[{"key":"A","text":"Rewrite the history so that no commit holds the key any more"},{"key":"B","text":"Delete the file in a new commit"},{"key":"C","text":"Revoke or rotate the key at the service that issued it"},{"key":"D","text":"Make the repository private"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Until the key is revoked, anyone with an old copy can use it; cleaning history comes second.","misconceptions":["Cleans the repository while the key still works for anyone who copied it","Removes it from the latest version only; the old commit still holds it","","Hides it from new readers, not from those who already cloned it"],"lo":["LO5"],"day":3,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"d3-delete-file","type":"tf","prompt":"Removing the settings file that held a key, in a new commit, removes the key from the repository.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Every earlier commit still holds the file; git log -S finds it until the history is rewritten.","misconceptions":["Thinks a repository holds only its latest version",""],"lo":["LO5"],"day":3,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"d3-env-files","type":"single","prompt":"A project needs a key. Which set-up keeps it out of the repository and still tells a newcomer what to provide?","options":[{"key":"A","text":"The key in settings.toml, and settings.toml added to .gitignore afterwards"},{"key":"B","text":"The key base64-encoded in the code"},{"key":"C","text":"The key in the README, in a section marked private"},{"key":"D","text":"An ignored .env file, and a committed .env.example naming the variable"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The value lives only in an ignored file or the environment; the example file documents the name.","misconceptions":["Ignoring a file already committed does not untrack it, and nothing documents the name","Takes encoding for encryption: anyone can decode it","Puts the secret in the most-read file of the repository",""],"lo":["LO5"],"day":3,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"d3-after-rewrite","type":"single","prompt":"A history was rewritten to remove a key and force-pushed. What must everyone who cloned it before do?","options":[{"key":"A","text":"Clone again, or reset hard to the rewritten branch"},{"key":"B","text":"Nothing, because the next git pull fixes their copy"},{"key":"C","text":"Run the secret scanner once"},{"key":"D","text":"Commit their work and push it to the hub as usual"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Rewritten commits have new ids; old clones still hold the old commits and must be replaced.","misconceptions":["","A pull merges the old history back, key included","Scanning finds the key but does not remove it from their copy","Pushing an old-history branch brings the removed commits back"],"lo":["LO5"],"day":3,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"d3-readme-section","type":"single","prompt":"Which Reproduce section lets a peer rebuild a report project on a clean machine?","options":[{"key":"A","text":"Run the notebook top to bottom"},{"key":"B","text":"Tools needed, where to get the data, one rebuild command and the expected checksum"},{"key":"C","text":"See the code for details"},{"key":"D","text":"Contact the analyst for the data path"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A peer needs the prerequisites, the data source, one command and a way to tell success from failure.","misconceptions":["Assumes the peer has the same packages, data and folder","","Leaves every decision to the reader","Makes reproduction depend on one person being available"],"lo":["LO6"],"day":3,"session":1,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d3-missing-data","type":"single","prompt":"In a peer reproduction, the rebuild fails: no such folder data/. The repository rightly does not hold the data. What is the fix?","options":[{"key":"A","text":"Commit the data folder into the repository so that every clone has it"},{"key":"B","text":"Tell the peer the folder in a chat message"},{"key":"C","text":"State where the data comes from and read its folder from a variable"},{"key":"D","text":"Hard-code the peer's folder in the script"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The README carries the knowledge; the script takes the location from outside.","misconceptions":["Puts data back into the code repository","Fixes this run only; the next reader hits the same wall","","Ties the script to a second computer instead of the first"],"lo":["LO6"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"d3-own-clone","type":"tf","prompt":"If a fresh clone rebuilds correctly on the author's own laptop, a peer reproduction adds nothing.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The author's laptop still holds caches, tools and knowledge the README may not state; a peer on a clean workspace finds those gaps.","misconceptions":["Equates a clean folder with a clean machine and a fresh reader",""],"lo":["LO6"],"day":3,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"d3-expected-output","type":"single","prompt":"How does a peer know a rebuild reproduced the expected result rather than just running?","options":[{"key":"A","text":"The program prints no error"},{"key":"B","text":"The output file exists in the output folder after the rebuild has run"},{"key":"C","text":"The numbers look plausible"},{"key":"D","text":"The rebuild compares the output with a committed checksum"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A committed checksum turns \"it ran\" into \"it produced the same bytes\".","misconceptions":["Takes running without error for being right","Checks presence, not content","Relies on judgement where an exact check is possible",""],"lo":["LO6"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"}]}</script>
